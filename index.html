<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상식 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- 시작 화면 -->
    <section id="screen-home" class="screen">
      <h1>상식 퀴즈</h1>
      <p class="lead">카테고리를 고르면 10문항이 시작됩니다.</p>
      <p id="data-error" class="error" hidden>문항 데이터에 오류가 있습니다</p>
      <div id="category-list" class="button-grid"></div>
    </section>

    <!-- 문제 화면 -->
    <section id="screen-quiz" class="screen" hidden>
      <div class="quiz-head">
        <span id="progress" class="progress"></span>
        <span id="round-label" class="round-label"></span>
      </div>
      <h2 id="question-text" class="question"></h2>
      <div id="option-list" class="option-list"></div>
      <div id="explain-area" class="explain" hidden>
        <p id="feedback" class="feedback"></p>
        <p id="explanation" class="explanation"></p>
        <p id="source" class="source"></p>
        <button id="next-btn" type="button" class="next">다음</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen" hidden>
      <h2>결과</h2>
      <p id="result-score" class="result-score"></p>
      <p id="result-label" class="round-label"></p>
      <div class="button-row">
        <button id="retry-btn" type="button">다시 하기</button>
        <button id="home-btn" type="button">시작으로</button>
      </div>
    </section>

    <!-- 순위표 화면 (3단계) -->
    <section id="screen-leaderboard" class="screen" hidden></section>

  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
