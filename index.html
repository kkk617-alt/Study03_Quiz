<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상식 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- 시작 화면 -->
    <section id="screen-home" class="screen">
      <h1>상식 퀴즈</h1>
      <p class="lead">카테고리를 고르세요. 한 판은 10문제입니다.</p>
      <p id="data-error" class="error" hidden>문항 데이터에 오류가 있습니다</p>
      <p class="field-label">모드</p>
      <div id="mode-list" class="button-grid mode-grid"></div>
      <div id="category-list" class="button-grid"></div>
      <p id="unranked-notice" class="notice" hidden></p>
    </section>

    <!-- 문제 화면 -->
    <section id="screen-quiz" class="screen" hidden>
      <div class="quiz-head">
        <span id="round-label" class="round-label"></span>
        <span id="progress" class="progress"></span>
        <span id="score" class="score"></span>
      </div>
      <h2 id="question-text" class="question"></h2>
      <div id="option-list" class="option-list"></div>
      <div id="explain-area" class="explain" hidden>
        <p id="feedback" class="feedback"></p>
        <p id="explanation" class="explanation"></p>
        <p class="source">출처: <a id="source-link" target="_blank" rel="noopener noreferrer"></a></p>
        <button id="next-btn" type="button" class="next">다음</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen" hidden>
      <h2>결과</h2>
      <p id="result-score" class="result-score"></p>
      <p id="result-label" class="round-label"></p>
      <p id="result-unranked" class="notice" hidden></p>
      <ol id="result-list" class="result-list"></ol>
      <div class="button-row">
        <button id="retry-btn" type="button">같은 모드 다시</button>
        <button id="home-btn" type="button">처음으로</button>
      </div>
    </section>

    <!-- 순위표 화면 (3단계) -->
    <section id="screen-leaderboard" class="screen" hidden></section>

  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
